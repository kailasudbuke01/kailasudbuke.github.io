<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Poster</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f2f2f2;
}

.container {
  max-width: 400px;
  margin: auto;
  padding: 15px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  margin: 5px;
  background: #ff6600;
  color: white;
  border: none;
  border-radius: 6px;
}

canvas {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h3>🎨 Super Poster Generator</h3>

<input type="text" id="name" placeholder="नाव">
<input type="text" id="post" placeholder="पदनाम">
<input type="text" id="school" placeholder="शाळा">

<input type="file" id="photo" accept="image/*">

<br>
<button onclick="generatePoster()">Poster Preview</button>
<button onclick="download()">Download HD</button>
<button onclick="share()">WhatsApp Share</button>

<canvas id="canvas" width="1080" height="1920"></canvas>

</div>

<script>
let photoData;

document.getElementById("photo").onchange = e=>{
  let r = new FileReader();
  r.onload = ()=> {
    photoData = r.result;
    generatePoster(); // auto preview
  }
  r.readAsDataURL(e.target.files[0]);
};

function generatePoster(){
  let canvas = document.getElementById("canvas");
  let ctx = canvas.getContext("2d");

  // Background
  let g = ctx.createLinearGradient(0,0,0,1920);
  g.addColorStop(0,"#f7c27a");
  g.addColorStop(1,"#f2a65a");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,1080,1920);

  ctx.textAlign="center";

  // Logo
  let logo = new Image();
  logo.src = "logo.jpg";
  logo.onload = ()=>{
    ctx.drawImage(logo, 80, 80, 150, 150);
  }

  // Title
  ctx.fillStyle="#a52a2a";
  ctx.font="bold 60px sans-serif";
  ctx.fillText("शिक्षण विभाग",540,200);
  ctx.fillStyle="#1e3a8a";
  ctx.fillText("नगरपालिका",540,280);

  // Circle frame
  ctx.beginPath();
  ctx.arc(540, 650, 200, 0, Math.PI*2);
  ctx.strokeStyle="#d97706";
  ctx.lineWidth=8;
  ctx.stroke();

  // Photo inside circle
  if(photoData){
    let img = new Image();
    img.onload = ()=>{
      ctx.save();
      ctx.beginPath();
      ctx.arc(540,650,190,0,Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img,340,450,400,400);
      ctx.restore();
    }
    img.src = photoData;
  }

  // Quote
  ctx.fillStyle="#8b0000";
  ctx.font="bold 50px sans-serif";
  ctx.fillText("होय, मी नगरपालिका शाळेत शिकलोय!",540,1000);

  let name = document.getElementById("name").value;
  let post = document.getElementById("post").value;
  let school = document.getElementById("school").value;

  ctx.fillStyle="#000";
  ctx.font="45px sans-serif";
  ctx.fillText("नाव: "+name,540,1150);
  ctx.fillText("पदनाम: "+post,540,1220);
  ctx.fillText("शाळा: "+school,540,1290);

  // Bottom banner
  ctx.fillStyle="#ff6600";
  ctx.fillRect(200,1600,680,120);

  ctx.fillStyle="white";
  ctx.font="bold 50px sans-serif";
  ctx.fillText("माझी शाळा माझे वैभव",540,1680);
}

function download(){
  let link = document.createElement("a");
  link.download = "SuperPoster.png";
  link.href = document.getElementById("canvas").toDataURL();
  link.click();
}

function share(){
  let text = "मी नगरपालिका शाळेत शिकलोय! 👉 " + window.location.href;
  window.open("https://wa.me/?text="+encodeURIComponent(text));
}

// Auto load preview
generatePoster();
</script>

</body>
</html>
